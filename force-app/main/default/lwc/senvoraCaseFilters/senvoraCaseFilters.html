<template>
  <section
    class="slds-box slds-theme_default"
    aria-labelledby="filters-heading"
  >
    <div
      class="slds-grid slds-wrap slds-grid_vertical-align-end slds-gutters_small"
    >
      <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-5">
        <h2
          id="filters-heading"
          class="slds-text-heading_small slds-m-bottom_x-small"
        >
          Filter cases
        </h2>
        <lightning-input
          type="search"
          label="Search cases"
          value={searchTerm}
          onchange={handleSearchChange}
          disabled={controlsDisabled}
        ></lightning-input>
      </div>

      <div
        class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-5"
      >
        <lightning-combobox
          name="status"
          label="Status"
          value={status}
          options={statusOptions}
          onchange={handleStatusChange}
          disabled={controlsDisabled}
        ></lightning-combobox>
      </div>

      <div
        class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-5"
      >
        <lightning-combobox
          name="priority"
          label="Priority"
          value={priority}
          options={priorityOptions}
          onchange={handlePriorityChange}
          disabled={controlsDisabled}
        ></lightning-combobox>
      </div>

      <div
        class="slds-col slds-size_1-of-1 slds-large-size_1-of-5 slds-p-bottom_xx-small"
      >
        <lightning-button
          label="Clear filters"
          onclick={handleClear}
          disabled={controlsDisabled}
        ></lightning-button>
      </div>
    </div>

    <template lwc:if={metadataLoading}>
      <div class="slds-is-relative metadata-state" role="status">
        <lightning-spinner
          alternative-text="Loading case filters"
          size="small"
        ></lightning-spinner>
      </div>
    </template>

    <template lwc:elseif={metadataError}>
      <p class="slds-text-color_error slds-m-top_small" role="alert">
        Case filters are temporarily unavailable.
      </p>
    </template>
  </section>
</template>
